<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirana Store Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f7;
  color:#17202a;
  padding:15px;
}

.container{max-width:700px;margin:auto}

.header{
  background:#17202a;
  color:#fff;
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
}

.header h1{font-size:25px}
.header p{margin-top:6px;opacity:.8;font-size:14px}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.card h2{font-size:18px;margin-bottom:15px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input,select{
  width:100%;
  height:48px;
  border:1px solid #ccd2d8;
  border-radius:10px;
  padding:0 12px;
  font-size:17px;
  outline:none;
  background:#fff;
}

input:focus,select:focus{border-color:#17202a}

.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}

.mode button,
.unit-buttons button,
.quick button,
.main-btn,
.clear-btn,
.print-btn,
.download-btn{
  min-height:45px;
  border:1px solid #ccd2d8;
  border-radius:10px;
  background:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.mode button.active,
.unit-buttons button.active,
.main-btn{
  background:#17202a;
  color:#fff;
  border-color:#17202a;
}

.unit-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

.unit-buttons button{padding:0 15px}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:8px;
}

.quick button{min-height:42px}

.result-box{
  margin-top:18px;
  background:#f0f3f5;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.result-title{
  font-size:13px;
  color:#69747d;
}

.result{
  font-size:34px;
  font-weight:800;
  margin-top:5px;
}

.result-sub{
  color:#69747d;
  margin-top:5px;
  font-size:14px;
}

.main-btn{
  width:100%;
  margin-top:15px;
}

.bill-table{
  width:100%;
  border-collapse:collapse;
  margin-top:5px;
}

.bill-table th,
.bill-table td{
  padding:10px 5px;
  border-bottom:1px solid #e4e7e9;
  text-align:left;
  font-size:14px;
}

.bill-table th:last-child,
.bill-table td:last-child{
  text-align:right;
}

.bill-table th:nth-child(2),
.bill-table td:nth-child(2){
  text-align:center;
}

.remove-btn{
  border:0;
  background:none;
  cursor:pointer;
  font-size:18px;
  padding:4px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:800;
  padding-top:15px;
}

.bill-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.print-btn{
  background:#17202a;
  color:#fff;
}

.download-btn{
  background:#fff;
}

.clear-btn{
  background:#fff;
}

.small{
  color:#69747d;
  font-size:12px;
  margin-top:7px;
}

.hidden{display:none}

@media(max-width:550px){
  .grid{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(3,1fr)}
  .result{font-size:30px}
  .bill-table th,.bill-table td{
    font-size:12px;
    padding:8px 3px;
  }
  .bill-actions{
    grid-template-columns:1fr;
  }
}

/* PRINT BILL */
@media print{

  body{
    background:#fff;
    padding:0;
  }

  body *{
    visibility:hidden;
  }

  #printArea,
  #printArea *{
    visibility:visible;
  }

  #printArea{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    padding:20px;
  }

  .print-hide{
    display:none !important;
  }

  .print-title{
    display:block !important;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header print-hide">
    <h1>🛒 Kirana Store Calculator</h1>
    <p>Gram • Kg • ML • Litre • Piece • Dozen</p>
  </div>

  <!-- CALCULATOR -->

  <div class="card print-hide">

    <h2>🧮 Calculation</h2>

    <div class="mode">

      <button id="quantityMode" class="active">
        Quantity → ₹
      </button>

      <button id="moneyMode">
        ₹ → Quantity
      </button>

    </div>

    <div class="grid">

      <div>
        <label>Item Name</label>
        <input
          type="text"
          id="itemName"
          placeholder="Example: Jeera"
        >
      </div>

      <div>
        <label>Rate</label>
        <input
          type="number"
          id="rate"
          min="0"
          step="0.01"
          placeholder="Example: 235"
        >
      </div>

    </div>

    <div style="margin-top:15px">

      <label>Rate Kis Unit Ke Hisab Se Hai?</label>

      <div class="unit-buttons">

        <button data-rateunit="kg" class="active">
          ₹ / Kg
        </button>

        <button data-rateunit="litre">
          ₹ / Litre
        </button>

        <button data-rateunit="piece">
          ₹ / Piece
        </button>

        <button data-rateunit="dozen">
          ₹ / Dozen
        </button>

      </div>

    </div>

    <!-- QUANTITY -->

    <div id="quantitySection" style="margin-top:15px">

      <label id="quantityLabel">Quantity</label>

      <input
        type="number"
        id="quantity"
        min="0"
        step="0.01"
        placeholder="Enter quantity"
      >

      <div class="quick" id="quantityQuick"></div>

    </div>

    <!-- MONEY -->

    <div
      id="moneySection"
      class="hidden"
      style="margin-top:15px"
    >

      <label>Customer Ke Kitne ₹ Ka?</label>

      <input
        type="number"
        id="money"
        min="0"
        step="0.01"
        placeholder="Example: 50"
      >

      <div class="quick">

        <button data-money="10">₹10</button>
        <button data-money="20">₹20</button>
        <button data-money="50">₹50</button>
        <button data-money="100">₹100</button>
        <button data-money="200">₹200</button>
        <button data-money="500">₹500</button>

      </div>

    </div>

    <div class="result-box">

      <div class="result-title">RESULT</div>

      <div class="result" id="result">
        ₹0.00
      </div>

      <div class="result-sub" id="resultSub">
        Rate aur quantity enter karein
      </div>

    </div>

    <button class="main-btn" id="addToBill">
      ➕ Add To Bill
    </button>

  </div>


  <!-- BILL -->

  <div class="card" id="printArea">

    <div class="print-title" style="display:none;text-align:center;margin-bottom:18px">
      <h1>KIRANA STORE</h1>
      <p>Customer Bill</p>
      <hr style="margin-top:10px">
    </div>

    <div class="print-hide">
      <h2>🧾 Current Bill</h2>
    </div>

    <div id="billList">

      <div class="small">
        Abhi bill mein koi item nahi hai.
      </div>

    </div>

    <div class="total">

      <span>Grand Total</span>

      <span id="grandTotal">
        ₹0.00
      </span>

    </div>

    <div class="bill-actions print-hide">

      <button class="print-btn" id="printBill">
        🖨️ Print Bill
      </button>

      <button class="download-btn" id="downloadBill">
        ⬇️ Download
      </button>

      <button class="clear-btn" id="clearBill">
        🗑 Clear Bill
      </button>

    </div>

  </div>

</div>


<script>

let calculationMode = "quantity";
let rateUnit = "kg";
let grandTotal = 0;
let billItems = [];


/* ELEMENTS */

const rateInput =
  document.getElementById("rate");

const quantityInput =
  document.getElementById("quantity");

const moneyInput =
  document.getElementById("money");

const itemName =
  document.getElementById("itemName");

const result =
  document.getElementById("result");

const resultSub =
  document.getElementById("resultSub");

const quantityQuick =
  document.getElementById("quantityQuick");

const quantitySection =
  document.getElementById("quantitySection");

const moneySection =
  document.getElementById("moneySection");

const billList =
  document.getElementById("billList");

const grandTotalElement =
  document.getElementById("grandTotal");


/* UNIT */

function getQuantityUnit(){

  if(rateUnit === "kg")
    return "g";

  if(rateUnit === "litre")
    return "ml";

  if(rateUnit === "piece")
    return "pcs";

  if(rateUnit === "dozen")
    return "pcs";

}


/* QUICK BUTTONS */

function createQuickButtons(){

  quantityQuick.innerHTML = "";

  let values = [];

  if(rateUnit === "kg"){

    values = [
      [50,"50g"],
      [100,"100g"],
      [200,"200g"],
      [250,"250g"],
      [500,"500g"],
      [1000,"1kg"]
    ];

  }

  else if(rateUnit === "litre"){

    values = [
      [50,"50ml"],
      [100,"100ml"],
      [250,"250ml"],
      [500,"500ml"],
      [750,"750ml"],
      [1000,"1L"]
    ];

  }

  else{

    values = [
      [1,"1"],
      [2,"2"],
      [5,"5"],
      [10,"10"],
      [12,"1 Dozen"]
    ];

  }


  values.forEach(function(item){

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent = item[1];

    button.onclick = function(){

      quantityInput.value = item[0];

      calculate();

    };

    quantityQuick.appendChild(button);

  });

}


/* CALCULATE */

function calculate(){

  const rate =
    parseFloat(rateInput.value) || 0;


  if(calculationMode === "quantity"){

    const quantity =
      parseFloat(quantityInput.value) || 0;


    if(rate <= 0 || quantity <= 0){

      result.textContent = "₹0.00";

      resultSub.textContent =
        "Rate aur quantity enter karein";

      return;

    }


    let amount = 0;


    if(rateUnit === "kg")
      amount = rate * quantity / 1000;

    else if(rateUnit === "litre")
      amount = rate * quantity / 1000;

    else if(rateUnit === "piece")
      amount = rate * quantity;

    else if(rateUnit === "dozen")
      amount = rate * quantity / 12;


    result.textContent =
      "₹" + amount.toFixed(2);


    resultSub.textContent =
      quantity + " " +
      getQuantityUnit() +
      " = ₹" +
      amount.toFixed(2);

  }


  else{

    const money =
      parseFloat(moneyInput.value) || 0;


    if(rate <= 0 || money <= 0){

      result.textContent = "0";

      resultSub.textContent =
        "Rate aur ₹ amount enter karein";

      return;

    }


    let quantity = 0;
    let unit = "";


    if(rateUnit === "kg"){

      quantity =
        money / rate * 1000;

      unit = "g";

    }

    else if(rateUnit === "litre"){

      quantity =
        money / rate * 1000;

      unit = "ml";

    }

    else if(rateUnit === "piece"){

      quantity =
        money / rate;

      unit = "pcs";

    }

    else if(rateUnit === "dozen"){

      quantity =
        money / rate * 12;

      unit = "pcs";

    }


    result.textContent =
      quantity.toFixed(2) +
      " " +
      unit;


    resultSub.textContent =
      "₹" +
      money.toFixed(2) +
      " ka maal";

  }

}


/* MODE */

document
.getElementById("quantityMode")
.addEventListener("click",function(){

  calculationMode = "quantity";

  this.classList.add("active");

  document
  .getElementById("moneyMode")
  .classList.remove("active");

  quantitySection.classList.remove("hidden");

  moneySection.classList.add("hidden");

  calculate();

});


document
.getElementById("moneyMode")
.addEventListener("click",function(){

  calculationMode = "money";

  this.classList.add("active");

  document
  .getElementById("quantityMode")
  .classList.remove("active");

  moneySection.classList.remove("hidden");

  quantitySection.classList.add("hidden");

  calculate();

});


/* RATE UNIT */

document
.querySelectorAll("[data-rateunit]")
.forEach(function(button){

  button.addEventListener("click",function(){

    document
    .querySelectorAll("[data-rateunit]")
    .forEach(function(b){
      b.classList.remove("active");
    });

    this.classList.add("active");

    rateUnit =
      this.dataset.rateunit;

    createQuickButtons();

    calculate();

  });

});


/* INPUT EVENTS */

rateInput.addEventListener("input",calculate);
quantityInput.addEventListener("input",calculate);
moneyInput.addEventListener("input",calculate);


/* MONEY QUICK */

document
.querySelectorAll("[data-money]")
.forEach(function(button){

  button.addEventListener("click",function(){

    moneyInput.value =
      this.dataset.money;

    calculate();

  });

});


/* GET CURRENT AMOUNT */

function getCurrentAmount(){

  const rate =
    parseFloat(rateInput.value) || 0;


  if(calculationMode === "money"){

    const money =
      parseFloat(moneyInput.value) || 0;

    return money;

  }


  const quantity =
    parseFloat(quantityInput.value) || 0;


  if(rateUnit === "kg")
    return rate * quantity / 1000;

  if(rateUnit === "litre")
    return rate * quantity / 1000;

  if(rateUnit === "piece")
    return rate * quantity;

  if(rateUnit === "dozen")
    return rate * quantity / 12;

}


/* GET CURRENT QUANTITY TEXT */

function getCurrentQuantity(){

  if(calculationMode === "money"){

    const rate =
      parseFloat(rateInput.value) || 0;

    const money =
      parseFloat(moneyInput.value) || 0;

    if(rate <= 0 || money <= 0)
      return "-";


    let q = 0;
    let unit = "";


    if(rateUnit === "kg"){

      q = money / rate * 1000;
      unit = "g";

    }

    else if(rateUnit === "litre"){

      q = money / rate * 1000;
      unit = "ml";

    }

    else if(rateUnit === "piece"){

      q = money / rate;
      unit = "pcs";

    }

    else{

      q = money / rate * 12;
      unit = "pcs";

    }


    return q.toFixed(2) + " " + unit;

  }


  const q =
    parseFloat(quantityInput.value) || 0;


  if(!q)
    return "-";


  if(rateUnit === "kg")
    return q + " g";

  if(rateUnit === "litre")
    return q + " ml";

  if(rateUnit === "piece")
    return q + " pcs";

  if(rateUnit === "dozen")
    return q + " pcs";

}


/* ADD TO BILL */

document
.getElementById("addToBill")
.addEventListener("click",function(){

  const name =
    itemName.value.trim() || "Item";


  const amount =
    getCurrentAmount();


  if(!amount || amount <= 0){

    alert("Pehle valid calculation karein.");

    return;

  }


  const quantityText =
    getCurrentQuantity();


  const rate =
    parseFloat(rateInput.value) || 0;


  const rateText =
    "₹" +
    rate.toFixed(2) +
    "/" +
    (
      rateUnit === "kg"
      ? "kg"
      : rateUnit === "litre"
      ? "L"
      : rateUnit === "piece"
      ? "pc"
      : "doz"
    );


  billItems.push({

    name:name,

    quantity:quantityText,

    rate:rateText,

    amount:amount

  });


  grandTotal += amount;


  renderBill();


  /* Clear item fields */

  itemName.value = "";

  quantityInput.value = "";

  moneyInput.value = "";

  result.textContent = "₹0.00";

  resultSub.textContent =
    "Next item ke liye ready";

});


/* RENDER BILL */

function renderBill(){

  billList.innerHTML = "";


  if(billItems.length === 0){

    billList.innerHTML =
      '<div class="small">Abhi bill mein koi item nahi hai.</div>';

    grandTotalElement.textContent =
      "₹0.00";

    return;

  }


  const table =
    document.createElement("table");

  table.className =
    "bill-table";


  table.innerHTML = `
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Amount</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `;


  const tbody =
    table.querySelector("tbody");


  billItems.forEach(function(item,index){

    const tr =
      document.createElement("tr");


    const tdName =
      document.createElement("td");

    tdName.textContent =
      item.name;


    const tdQty =
      document.createElement("td");

    tdQty.textContent =
      item.quantity;


    const tdAmount =
      document.createElement("td");

    tdAmount.textContent =
      "₹" + item.amount.toFixed(2);


    const tdRemove =
      document.createElement("td");

    const remove =
      document.createElement("button");

    remove.className =
      "remove-btn print-hide";

    remove.textContent =
      "✕";

    remove.title =
      "Remove item";


    remove.onclick =
      function(){

        grandTotal -=
          billItems[index].amount;

        billItems.splice(index,1);

        renderBill();

      };


    tdRemove.appendChild(remove);


    tr.appendChild(tdName);
    tr.appendChild(tdQty);
    tr.appendChild(tdAmount);
    tr.appendChild(tdRemove);


    tbody.appendChild(tr);

  });


  billList.appendChild(table);


  grandTotalElement.textContent =
    "₹" + grandTotal.toFixed(2);

}


/* PRINT */

document
.getElementById("printBill")
.addEventListener("click",function(){

  if(billItems.length === 0){

    alert("Bill mein koi item nahi hai.");

    return;

  }


  window.print();

});


/* DOWNLOAD BILL */

document
.getElementById("downloadBill")
.addEventListener("click",function(){

  if(billItems.length === 0){

    alert("Bill mein koi item nahi hai.");

    return;

  }


  let text = "";

  text +=
    "================================\n";

  text +=
    "          KIRANA STORE\n";

  text +=
    "            BILL\n";

  text +=
    "================================\n\n";


  billItems.forEach(function(item,index){

    text +=
      (index + 1) +
      ". " +
      item.name +
      "\n";

    text +=
      "   Qty : " +
      item.quantity +
      "\n";

    text +=
      "   Rate: " +
      item.rate +
      "\n";

    text +=
      "   Amount: ₹" +
      item.amount.toFixed(2) +
      "\n";

    text +=
      "--------------------------------\n";

  });


  text += "\n";

  text +=
    "GRAND TOTAL: ₹" +
    grandTotal.toFixed(2) +
    "\n";

  text +=
    "================================\n";

  text +=
    "        Thank You\n";

  text +=
    "================================\n";


  const blob =
    new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "Kirana-Bill-" +
    new Date().toISOString()
    .slice(0,10) +
    ".txt";


  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

});


/* CLEAR BILL */

document
.getElementById("clearBill")
.addEventListener("click",function(){

  if(billItems.length === 0)
    return;


  if(!confirm("Pura bill clear karna hai?"))
    return;


  billItems = [];

  grandTotal = 0;

  renderBill();

});


/* START */

createQuickButtons();

renderBill();

</script>

</body>
</html>
